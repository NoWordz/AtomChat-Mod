name: Build

# versions/targets.json supplies the supported targets and JDKs.

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**.md"
      - "docs/**"
  workflow_dispatch:
    inputs:
      atomlib_input_url:
        description: 'Explicit HTTPS Maven candidate archive (empty uses the configured input)'
        type: string
        required: false
      atomlib_input_sha256:
        description: 'SHA-256 of that exact archive; contained JARs must also match versions/atomlib.json'
        type: string
        required: false

permissions:
  contents: read

jobs:
  targets:
    name: 校验矩阵
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验目标、输入和归档规则
        run: |
          python3 tools/verify_targets.py --matrix-out "$RUNNER_TEMP/matrix.json"
          python3 tools/test_fetch_atomlib_input.py
          python3 tools/test_verify_jars.py
          python3 tools/test_frontend_contract_ci.py

      - name: 导出验证和分发矩阵
        id: matrix
        env:
          CONTRACT_PR_BASE: ${{ github.event.pull_request.base.sha }}
          CONTRACT_REVIEWED: ${{ vars.ATOMCHAT_FRONTEND_REVIEWED_REVISION }}
        run: python3 tools/frontend_contract_ci.py matrix "$RUNNER_TEMP/matrix.json"

  build:
    name: 构建 ${{ matrix.target }} / ${{ matrix.mode }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Skija 的 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: "${{ matrix.java }}"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: 获取并认证固定 AtomLib 输入
        shell: bash
        env:
          ATOMLIB_INPUT_URL: ${{ inputs.atomlib_input_url || vars.ATOMLIB_INPUT_URL }}
          ATOMLIB_INPUT_SHA256: ${{ inputs.atomlib_input_sha256 || vars.ATOMLIB_INPUT_SHA256 }}
        run: python tools/fetch_atomlib_input.py --url "$ATOMLIB_INPUT_URL" --sha256 "$ATOMLIB_INPUT_SHA256" --output "$RUNNER_TEMP/atomlib-input-path"

      - name: Linux 构建与测试
        if: matrix.mode == 'linux-verify'
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
        run: python tools/frontend_contract_ci.py build "$PROJECT" "$RUNNER_TEMP/maven" --mode linux-verify

      - name: 构建并检验分发包
        if: matrix.mode != 'linux-verify'
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          CONTRACT_MODE: ${{ matrix.mode }}
          CONTRACT_REVIEWED: ${{ matrix.reviewed }}
        run: python tools/frontend_contract_ci.py build "$PROJECT" "$RUNNER_TEMP/maven" --mode "$CONTRACT_MODE" --reviewed="$CONTRACT_REVIEWED" --dist dist

      - name: 上传分发包
        if: matrix.mode != 'linux-verify'
        uses: actions/upload-artifact@v7
        with:
          name: atomchat-pair-${{ matrix.target }}${{ matrix.suffix }}
          path: dist/*.jar
          if-no-files-found: error
