name: Release

# 单分支多目标：发什么由 versions/targets.json 决定，本文件里没有分支名。
#
# 【标签分两类】
#   vX.Y.Z        正式版 —— 建 Release，并发布到 CurseForge（Modrinth 未配置 token / 项目 id 时自动跳过）
#   vX.Y.Z-rc1    预发布 —— 只建 prerelease，**不发布到商店**；演练与候选版走这条
# 分这两类是为了让"走一遍完整流程"不必污染商店：pre 标签会把发布那一段整段跳过。
#
# 【workflow_dispatch】用来在不动标签的情况下重跑发布（token 换了、商店侧卡住），
# target 输入可以只发某一个目标；dry_run 只构建与校验，不建 Release、不发商店。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      target:
        description: 只发布某个目标（手动触发时）
        required: false
        default: all
        type: choice
        options:
          - all
          - 1.21.1-fabric
          - 1.21.1-neoforge
          - 1.20.1-forge
      dry_run:
        description: 只构建与校验，不建 Release、不发布到商店
        required: false
        default: false
        type: boolean

      atomlib_input_url:
        description: 'Explicit HTTPS Maven candidate archive (empty uses the configured input)'
        type: string
        required: false
      atomlib_input_sha256:
        description: 'SHA-256 of that exact archive; contained JARs must also match versions/atomlib.json'
        type: string
        required: false

permissions:
  contents: write

env:
  PYTHONUTF8: "1"

jobs:
  targets:
    name: 校验矩阵
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      distribution: ${{ steps.matrix.outputs.distribution }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 校验版本和归档规则
        run: |
          python3 tools/verify_targets.py --matrix-out "$RUNNER_TEMP/matrix.json"
          python3 tools/test_verify_jars.py

      - name: 校验仓库版本号与标签一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          EXPECTED="${GITHUB_REF_NAME#v}"
          ACTUAL="$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '\r')"
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "::error::仓库根的 mod_version=${ACTUAL} 与标签 ${EXPECTED} 不一致"
            exit 1
          fi
          echo "版本 ${ACTUAL} 与标签一致"

      - name: 导出验证和分发矩阵
        id: matrix
        env:
          CONTRACT_REVIEWED: ${{ vars.ATOMCHAT_FRONTEND_REVIEWED_REVISION }}
        run: python3 tools/frontend_contract_ci.py matrix "$RUNNER_TEMP/matrix.json"

  build:
    name: 构建 ${{ matrix.target }} / ${{ matrix.mode }}
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.build) }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Skija 的 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: 安装 Linux OpenGL 测试环境
        if: matrix.mode == 'linux-verify'
        run: sudo apt-get install -y xvfb libgl1-mesa-dri

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: "${{ matrix.java }}"
          distribution: ${{ matrix.java_distribution || 'temurin' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 获取并认证固定 AtomLib 输入
        shell: bash
        env:
          # Legacy tags keep using their released pin unless dispatch supplies an explicit archive.
          ATOMLIB_INPUT_URL: ${{ inputs.atomlib_input_url || (matrix.mode != 'legacy' && vars.ATOMLIB_INPUT_URL) || '' }}
          ATOMLIB_INPUT_SHA256: ${{ inputs.atomlib_input_sha256 || (matrix.mode != 'legacy' && vars.ATOMLIB_INPUT_SHA256) || '' }}
        run: python tools/fetch_atomlib_input.py --url "$ATOMLIB_INPUT_URL" --sha256 "$ATOMLIB_INPUT_SHA256" --output "$RUNNER_TEMP/atomlib-input-path"

      - name: Linux 构建与测试
        if: matrix.mode == 'linux-verify'
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a python tools/frontend_contract_ci.py build "$PROJECT" "$RUNNER_TEMP/maven" --mode linux-verify

      - name: 构建并检验发布归档
        if: matrix.mode != 'linux-verify'
        shell: bash
        env:
          PROJECT: ${{ matrix.project }}
          CONTRACT_MODE: ${{ matrix.mode }}
          CONTRACT_REVIEWED: ${{ matrix.reviewed }}
        run: python tools/frontend_contract_ci.py build "$PROJECT" "$RUNNER_TEMP/maven" --mode "$CONTRACT_MODE" --reviewed="$CONTRACT_REVIEWED" --dist dist

      - name: 上传分发包
        if: matrix.mode != 'linux-verify'
        uses: actions/upload-artifact@v7
        with:
          name: jar-pair-${{ matrix.target }}${{ matrix.suffix }}
          path: dist/*.jar
          if-no-files-found: error

  release:
    name: 建 Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 取回三个 AC/Lib 配套
        uses: actions/download-artifact@v8
        with:
          pattern: jar-pair-*
          path: artifacts
          merge-multiple: true

      - name: 汇总并校验数量
        run: |
          set -euo pipefail
          mkdir -p release-out
          find artifacts -name "*.jar" ! -name "*sources*" ! -name "*-slim*" -exec cp {} release-out/ \;
          ls -la release-out
          count=$(find release-out -name "*.jar" | wc -l)
          echo "Release 将挂上 ${count} 个 jar"
          if [ "$count" -ne 6 ]; then
            echo "::error::Release 期望 6 个 JAR（3 个 AC + 3 个配套 AtomLib），实际 ${count} 个"
            exit 1
          fi

      # 发布说明取自仓库根的 RELEASE_NOTES.md（单分支之后它只有一份）
      - name: 摘出版本对应的说明
        run: |
          VERSION="${GITHUB_REF_NAME#v}" python3 - <<'PY'
          import os
          version = os.environ["VERSION"]
          with open("RELEASE_NOTES.md", encoding="utf-8") as f:
              notes = f.read()
          start = notes.find("## v" + version)
          if start < 0:
              # 预发布/hotfix 标签复用基础版本的段落（v0.2.92-rc1 → v0.2.92）
              start = notes.find("## v" + version.split("-")[0])
          if start < 0:
              raise SystemExit(f"ERROR: RELEASE_NOTES.md 里没有 '## v{version}' 段落 —— 打标签前先写它")
          end = notes.find("\n## ", start + 1)
          section = (notes[start:end] if end > start else notes[start:]).strip()
          with open("release-notes.md", "w", encoding="utf-8") as f:
              f.write(section + "\n")
          print(section[:400])
          PY

      - name: 建 Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-out/*.jar
          body_path: release-notes.md
          draft: false
          # 带后缀的标签（-rc1 / -beta / -alpha）就是预发布
          prerelease: ${{ contains(github.ref_name, '-') }}

  publish:
    name: 发布到商店 ${{ matrix.target }}
    needs: [targets, build]
    if: >-
      ${{
        startsWith(github.ref, 'refs/tags/v') &&
        !contains(github.ref_name, '-') &&
        inputs.dry_run != true
      }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.targets.outputs.distribution) }}
    env:
      PROJECT: ${{ matrix.project }}
      CONTRACT_MODE: ${{ matrix.mode }}
      CONTRACT_REVIEWED: ${{ matrix.reviewed }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 安装 Skija 的 Linux 系统依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: 设置 JDK ${{ matrix.java }}
        uses: actions/setup-java@v6
        with:
          java-version: "${{ matrix.java }}"
          distribution: ${{ matrix.java_distribution || 'temurin' }}

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: 获取并认证固定 AtomLib 输入
        shell: bash
        env:
          # Legacy tags keep using their released pin unless dispatch supplies an explicit archive.
          ATOMLIB_INPUT_URL: ${{ inputs.atomlib_input_url || (matrix.mode != 'legacy' && vars.ATOMLIB_INPUT_URL) || '' }}
          ATOMLIB_INPUT_SHA256: ${{ inputs.atomlib_input_sha256 || (matrix.mode != 'legacy' && vars.ATOMLIB_INPUT_SHA256) || '' }}
        run: python tools/fetch_atomlib_input.py --url "$ATOMLIB_INPUT_URL" --sha256 "$ATOMLIB_INPUT_SHA256" --output "$RUNNER_TEMP/atomlib-input-path"

      - name: 构建并检验商店归档
        if: inputs.target == '' || inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        run: python tools/frontend_contract_ci.py build "$PROJECT" "$RUNNER_TEMP/maven" --mode "$CONTRACT_MODE" --reviewed="$CONTRACT_REVIEWED"

      # Reuse the verified build directory in the same job and pass the same reviewed revision.
      - name: 发布到 Modrinth 与 CurseForge
        if: inputs.target == '' || inputs.target == 'all' || inputs.target == matrix.target
        shell: bash
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
        run: python tools/frontend_contract_ci.py publish "$PROJECT" "$RUNNER_TEMP/maven" --mode "$CONTRACT_MODE" --reviewed="$CONTRACT_REVIEWED"
