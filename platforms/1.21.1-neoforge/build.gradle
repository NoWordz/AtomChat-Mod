plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/atomchat-layers.gradle'

tasks.named('wrapper', Wrapper).configure {
    // Keep the wrapper current for ModDevGradle; this project runs on the same
    // Gradle 9 line as the other NeoForge 1.21.1 workspaces.
    distributionType = Wrapper.DistributionType.BIN
}

version = project.mod_version
group = project.mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

base {
    archivesName = "${project.mod_id}-NeoForge-${project.minecraft_version}"
}

// Mojang ships Java 21 to end users in 1.21.1, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    // No Parchment layer on purpose: AtomChat was written against Yarn and is
    // being ported to the official Mojang names used by NeoForge; adding
    // Parchment would only rename parameters, not classes/methods.
    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', file('src/generated/resources/').getAbsolutePath(),
                    '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${project.mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    unitTest {
        enable()
        testedMod = mods."${project.mod_id}"
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

repositories {
    mavenCentral()
}

dependencies {
    compileOnly "org.spongepowered:mixin:0.8.7"

    // Skija (HumbleUI Skia bindings) — same line as the Tuui mod used.
    // NeoForge loads nested jars through JarJar; version ranges are required
    // so a server can pick one copy when multiple mods bundle the same library.
    jarJar(implementation("io.github.humbleui:skija-shared:[${project.skija_version},0.117)"))
    jarJar(implementation("io.github.humbleui:types:[0.1.1,0.2)"))
    // Windows x64 native. Add linux/mac natives when publishing cross-platform.
    jarJar(implementation("io.github.humbleui:skija-windows-x64:[${project.skija_version},0.117)"))

    // FlatLaf gives the Swing image picker a modern flat look instead of the
    // dated default Metal one. Bundled as a RELOCATED copy (private package, see
    // third_party/ and gradle/atomchat-layers.gradle): another mod shipping
    // com.formdev.flatlaf.* used to win the class loading race, and our picker
    // then ran on that copy. Regenerate with tools/relocate-flatlaf.sh.
    jarJar(implementation(project.atomchatBundledFlatLafRange))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    // CI test hosts run on Linux; the bundled jar targets Windows only, so the
    // Linux Skija native is test-scoped and never packaged.
    testImplementation "io.github.humbleui:skija-linux-x64:${project.skija_version}"
}

// This block expands all declared replace properties in the resource targets.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
        showCauses = true
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ---------------------------------------------------------------------------
// Release publishing (Modrinth + CurseForge)
//
// Tokens come from the environment only — never commit them. The publishing
// tasks are skipped when the matching token is absent, so everyday builds and
// tests run without any store credentials. Project IDs live in
// gradle.properties (modrinth_project_id / curseforge_project_id).
// ---------------------------------------------------------------------------

// Store-facing version label, following the jar naming habit:
// NeoForge-<mc_version>-<mod_version>, e.g. NeoForge-1.21.1-0.2.3
def storeVersion = "NeoForge-${project.minecraft_version}-${project.mod_version}"

def changelogFor(version) {
    // 单分支之后 RELEASE_NOTES.md 只有仓库根那一份，各平台不再各存一份
    def text = new File(atomchatRepoRoot, 'RELEASE_NOTES.md').getText('UTF-8')
    // A prerelease suffix (0.3.0-Preview) shares the base version's section —
    // the suffix is not a version difference (skill changelog-format, rule 1).
    def base = version.split('-')[0]
    def start = text.indexOf("## v${base}")
    if (start < 0) {
        return "AtomChat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    // Store changelog convention: the trailing English block of the version
    // section in RELEASE_NOTES.md (Chinese summary first, English last; the
    // whole bilingual section is for the GitHub release body).
    def trimmed = section.trim()
    // Store changelog = 分隔线 `----` **之后**的英文块（格式与写法见 skill `changelog-format`）。
    // 【为什么不用"最后一个空行"】英文块自己也会分段（`**Fixed**` + 空行 + 条目），按空行取
    // 只会取到最后一段、把前面几段一起丢掉，而且构建照样是绿的 —— 静默丢失。
    // 用 `-{3,}` 而不是写死三个/四个横线：本仓库历史上两种都写过，不想被横线根数绑架。
    def sep = trimmed =~ /(?m)^-{3,}$/
    return sep.find() ? trimmed.substring(sep.end()).trim() : trimmed
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = project.modrinth_project_id
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = jar
    gameVersions = [project.minecraft_version]
    loaders = ["neoforge"]
    changelog = changelogFor(project.version)
}

tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        def main = upload(cfProjectId as int, jar)
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        main.addGameVersion project.minecraft_version
        main.addModLoader 'NeoForge'
        main.addJavaVersion 'Java 21'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
