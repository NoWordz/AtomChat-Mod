plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'org.spongepowered.mixin' version '0.7.+'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/atomchat-layers.gradle'

version = project.mod_version
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-Forge-${project.minecraft_version}"
}

// Forge 1.20.1 runs on Java 17, so the mod targets 17 instead of the 21 the
// Fabric and NeoForge 1.21.1 branches use.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

minecraft {
    mappings channel: mapping_channel, version: mapping_version

    // Widens the EditBox selection indexes and the stats map for AtomChatScreen
    // and ProfilePage. The file also ships in the jar, where Forge picks it up
    // automatically as META-INF/accesstransformer.cfg.
    accessTransformer file('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        configureEach {
            workingDirectory project.file('run')

            property 'forge.logging.markers', 'REGISTRIES'

            property 'forge.logging.console.level', 'debug'

            // Forge's production runtime names are SRG, so the refmap has to be
            // remapped against the SRG file ForgeGradle generates.
            jvmArg '-Dmixin.env.remapRefMap=true'
            jvmArg "-Dmixin.env.refMapRemappingFile=${projectDir}/build/createSrgToMcp/output.srg"

            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.configs', 'atomchat.client.mixins.json,atomchat.screen.mixins.json'
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            property 'mixin.configs', 'atomchat.client.mixins.json,atomchat.screen.mixins.json'
            args '--nogui'
        }

        data {
            workingDirectory project.file('run-data')

            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

mixin {
    add sourceSets.main, 'mixins.atomchat.refmap.json'
    config 'atomchat.client.mixins.json'
    config 'atomchat.screen.mixins.json'
}

// Skija and FlatLaf are embedded with Forge's JarJar (nested jars in
// META-INF/jarjar). ModDevGradle does the same for the NeoForge branch, and
// unlike a fat jar it lets the runtime pick one copy when two mods ship Skija.
jarJar.enable()

repositories {
    mavenCentral()
    // China mirrors last: fallback for local builds; overseas CI resolves from the canonical repos above
    maven {
        url 'https://mirrors.cloud.tencent.com/nexus/repository/maven-public/'
        allowInsecureProtocol = true
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
    compileOnly 'org.spongepowered:mixin:0.8.5'

    // Skija (HumbleUI Skia bindings) — same line the Fabric/NeoForge branches and
    // the Tuui mod use. Version ranges are required so a server with another
    // Skija-shipping mod can agree on one copy.
    jarJar(implementation("io.github.humbleui:skija-shared:[${project.skija_version},0.117)"))
    jarJar(implementation("io.github.humbleui:types:[0.1.1,0.2)"))
    // Windows x64 native. Add linux/mac natives when publishing cross-platform.
    jarJar(implementation("io.github.humbleui:skija-windows-x64:[${project.skija_version},0.117)"))

    // FlatLaf gives the Swing image picker a modern flat look instead of the
    // dated default Metal one. Bundled as a RELOCATED copy (private package, see
    // third_party/ and gradle/atomchat-layers.gradle): another mod shipping
    // com.formdev.flatlaf.* used to win the class loading race, and our picker
    // then ran on that copy. Regenerate with tools/relocate-flatlaf.sh.
    jarJar(implementation(project.atomchatBundledFlatLafRange))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher'
    // CI test hosts run on Linux; the bundled jar targets Windows only, so the
    // Linux Skija native is test-scoped and never packaged.
    testImplementation "io.github.humbleui:skija-linux-x64:${project.skija_version}"
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version      : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version, forge_version_range: forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors            : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

// The JarJar jar takes the plain name; the un-embedded jar keeps a classifier
// so the two never write to the same file (Gradle rejects that).
tasks.named('jarJar', Jar).configure {
    archiveClassifier = ''
}

tasks.named('jar', Jar).configure {
    archiveClassifier = 'slim'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1', // We are version 1 of ourselves
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'Implementation-Timestamp': new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                'MixinConfigs'            : 'atomchat.client.mixins.json,atomchat.screen.mixins.json'
        ])
    }

    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// The mixin annotation processor writes the refmap into build/tmp/compileJava,
// so copy it into the resources output where Mixin looks for it.
//
// An incremental compile can wipe build/tmp/compileJava without re-running the
// AP, and the refmap then disappears silently: the shipped jar dies at startup
// with "No refMap loaded" for every mixin (this really happened). The guard for
// that lives in verifyRefmap, NOT here — a Copy whose source is missing is
// reported as NO-SOURCE and Gradle then skips every action on the task, so a
// doFirst check in this task would never run in exactly the case it must catch.
tasks.register('copyRefmap', Copy) {
    from "${buildDir}/tmp/compileJava"
    into "${buildDir}/resources/main"
    include 'mixins.atomchat.refmap.json'
}

// Runs unconditionally (no declared outputs, so it can never be up to date) and
// fails the build when the refmap did not make it into the resources output.
tasks.register('verifyRefmap') {
    dependsOn 'copyRefmap'
    doLast {
        def refmap = file("${buildDir}/resources/main/mixins.atomchat.refmap.json")
        if (!refmap.isFile()) {
            throw new GradleException(
                "打出来的 jar 里没有 mixins.atomchat.refmap.json（${refmap.path} 不存在）。\n" +
                "Mixin 注解处理器没有产出它 —— 增量编译会清掉 build/tmp/compileJava 而不重跑 AP。\n" +
                "这样的 jar 启动时会以 'No refMap loaded' 崩掉，所以在这里直接失败。\n" +
                "解决：./gradlew clean build")
        }
    }
}
compileJava.finalizedBy 'copyRefmap'

tasks.register('writeDevManifest') {
    doLast {
        def mfDir = file("${buildDir}/resources/main/META-INF")
        mfDir.mkdirs()
        file("${mfDir}/MANIFEST.MF").text =
            'Manifest-Version: 1.0\n' +
            'MixinConfigs: atomchat.client.mixins.json,atomchat.screen.mixins.json\n'
        logger.lifecycle('Generated MANIFEST.MF with MixinConfigs for dev environment')
    }
}
processResources.finalizedBy 'writeDevManifest'
jar.dependsOn 'verifyRefmap'
// The JarJar jar is the shippable artifact: it carries the embedded Skija and
// FlatLaf jars as nested jars.
tasks.named('jarJar') { dependsOn 'verifyRefmap' }
compileTestJava.dependsOn 'copyRefmap'

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}


publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

// ---------------------------------------------------------------------------
// Release publishing (Modrinth + CurseForge), same shape as the other branches
// ---------------------------------------------------------------------------

def storeVersion = "Forge-${project.minecraft_version}-${project.mod_version}"

def changelogFor(version) {
    // 单分支之后 RELEASE_NOTES.md 只有仓库根那一份，各平台不再各存一份
    def text = new File(atomchatRepoRoot, 'RELEASE_NOTES.md').getText('UTF-8')
    def start = text.indexOf("## v${version}")
    if (start < 0) {
        return "AtomChat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    // Store changelog convention: the trailing English block of the version
    // section in RELEASE_NOTES.md (Chinese summary first, English last).
    def trimmed = section.trim()
    // Store changelog = 分隔线 `----` **之后**的英文块（格式与写法见 skill `changelog-format`）。
    // 【为什么不用"最后一个空行"】英文块自己也会分段（`**Fixed**` + 空行 + 条目），按空行取
    // 只会取到最后一段、把前面几段一起丢掉，而且构建照样是绿的 —— 静默丢失。
    // 用 `-{3,}` 而不是写死三个/四个横线：本仓库历史上两种都写过，不想被横线根数绑架。
    def sep = trimmed =~ /(?m)^-{3,}$/
    return sep.find() ? trimmed.substring(sep.end()).trim() : trimmed
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = (project.findProperty('modrinth_project_id') ?: '').toString()
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = tasks.named('jarJar').get()
    gameVersions = [project.minecraft_version]
    loaders = ["forge"]
    changelog = changelogFor(project.version)
}

def mrProjectId = (project.findProperty('modrinth_project_id') ?: '').toString()
tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") && !mrProjectId.isEmpty() && mrProjectId != 'UNSET' }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        def main = upload(cfProjectId as int, tasks.named('jarJar').get())
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        main.addGameVersion project.minecraft_version
        main.addModLoader 'Forge'
        main.addJavaVersion 'Java 17'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
