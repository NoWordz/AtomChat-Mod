org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false

# 仓库级身份（mod_version / mod_id / mod_name / mod_license / mod_group_id / mod_authors /
# mod_description）以及发布目标 id 只在【仓库根的 gradle.properties】里，由
# gradle/atomchat-layers.gradle 读进来挂到 project.ext。这里只留本平台专有的键 ——
# 身份留两份就会各自漂移，而"某个目标悄悄落后"正是这套结构要治的病。

minecraft_version=1.21.1
loader_version=0.16.9
loom_version=1.7.4

# 产物名带平台与版本，方便一个 Release 里挂三个 jar 时区分
archives_base_name=atomchat-Fabric-1.21.1

fabric_api_version=0.116.13+1.21.1

# Skija (HumbleUI Skia bindings, Java bindings and native are upgraded together)
# skija_version is shared in the repository root gradle.properties.

# Modern flat look and feel for the Swing image picker (Apache 2.0)
flatlaf_version=3.7.2
