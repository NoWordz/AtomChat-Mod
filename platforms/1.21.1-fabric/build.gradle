plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
    id 'com.modrinth.minotaur' version '2.8.7'
    id 'net.darkhax.curseforgegradle' version '1.1.28'
}

// 共享层装配：读仓库级身份 + 把 shared/ 与本目标挂载的层接进源集。
// 判定依据在 versions/*.json，本平台不做任何目标名硬编码。
apply from: '../../gradle/atomchat-layers.gradle'

version = project.mod_version
group = project.maven_group
archivesBaseName = project.archives_base_name

repositories {
    mavenCentral()
    maven { url = "https://maven.terraformersmc.com/releases/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.minecraft_version}+build.3:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modCompileOnly "com.terraformersmc:modmenu:11.0.3"

    // Skija (HumbleUI Skia bindings) — same line as the Tuui mod used.
    include(implementation("io.github.humbleui:skija-shared:${project.skija_version}"))
    include(implementation("io.github.humbleui:types:0.1.1"))
    // Windows x64 native. Add linux/mac natives when publishing cross-platform.
    include(implementation("io.github.humbleui:skija-windows-x64:${project.skija_version}"))

    // FlatLaf gives the Swing image picker a modern flat look instead of the
    // dated default Metal one. Bundled as a RELOCATED copy (private package, see
    // third_party/ and gradle/atomchat-layers.gradle): another mod shipping
    // com.formdev.flatlaf.* used to win the class loading race, and our picker
    // then ran on that copy. Regenerate with tools/relocate-flatlaf.sh.
    include(implementation(project.atomchatBundledFlatLaf))

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    // CI test hosts run on Linux; the bundled jar targets Windows only, so the
    // Linux Skija native is test-scoped and never packaged.
    testImplementation "io.github.humbleui:skija-linux-x64:${project.skija_version}"
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

java {
    withSourcesJar()
    toolchain.languageVersion = JavaLanguageVersion.of(21)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
        showStackTraces = true
        showCauses = true
    }
}

loom {
    accessWidenerPath = file("src/main/resources/atomchat.accesswidener")
}

// ---------------------------------------------------------------------------
// Release publishing (Modrinth + CurseForge)
//
// Tokens come from the environment only — never commit them. The publishing
// tasks are skipped when the matching token is absent, so everyday builds and
// tests run without any store credentials. Project IDs live in
// gradle.properties (modrinth_project_id / curseforge_project_id).
// ---------------------------------------------------------------------------

// Store-facing version label, following the jar naming habit:
// Fabric-<mc_version>-<mod_version>, e.g. Fabric-1.21.1-0.2.2
def storeVersion = "Fabric-${project.minecraft_version}-${project.mod_version}"

def changelogFor(version) {
    // 单分支之后 RELEASE_NOTES.md 只有仓库根那一份，各平台不再各存一份
    def text = new File(atomchatRepoRoot, 'RELEASE_NOTES.md').getText('UTF-8')
    def start = text.indexOf("## v${version}")
    if (start < 0) {
        return "AtomChat ${version}"
    }
    def end = text.indexOf('\n## ', start + 1)
    def section = end > start ? text.substring(start, end) : text.substring(start)
    // Store changelog convention: the trailing English block of the version
    // section in RELEASE_NOTES.md (Chinese summary first, English last; the
    // whole bilingual section is for the GitHub release body).
    def trimmed = section.trim()
    // Store changelog = 分隔线 `----` **之后**的英文块（格式与写法见 skill `changelog-format`）。
    // 【为什么不用"最后一个空行"】英文块自己也会分段（`**Fixed**` + 空行 + 条目），按空行取
    // 只会取到最后一段、把前面几段一起丢掉，而且构建照样是绿的 —— 静默丢失。
    // 用 `-{3,}` 而不是写死三个/四个横线：本仓库历史上两种都写过，不想被横线根数绑架。
    def sep = trimmed =~ /(?m)^-{3,}$/
    return sep.find() ? trimmed.substring(sep.end()).trim() : trimmed
}

modrinth {
    token = System.getenv("MODRINTH_TOKEN") ?: ""
    projectId = project.modrinth_project_id
    versionNumber = storeVersion
    versionType = "release"
    uploadFile = remapJar
    gameVersions = [project.minecraft_version]
    loaders = ["fabric"]
    changelog = changelogFor(project.version)

    dependencies {
        required.project "fabric-api"
    }
}

tasks.named('modrinth') {
    onlyIf { System.getenv("MODRINTH_TOKEN") }
}

def cfProjectId = (project.findProperty('curseforge_project_id') ?: '').toString()
def cfConfigured = cfProjectId ==~ /\d+/

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv("CURSEFORGE_TOKEN") ?: ""
    onlyIf { cfConfigured && System.getenv("CURSEFORGE_TOKEN") }

    if (cfConfigured) {
        def main = upload(cfProjectId as int, remapJar)
        main.changelogType = 'markdown'
        main.changelog = changelogFor(project.version)
        main.releaseType = 'release'
        main.displayName = storeVersion
        main.addGameVersion project.minecraft_version
        main.addModLoader 'Fabric'
        main.addJavaVersion 'Java 21'
        // CurseForge rejects uploads without an environment tag (error 1021).
        main.addEnvironment 'Client', 'Server'
        main.addRequirement 'fabric-api'
    }
}

tasks.register('publishMods') {
    group = 'publishing'
    description = 'Publish the mod to Modrinth and CurseForge.'
    dependsOn 'modrinth', 'curseforge'
}
