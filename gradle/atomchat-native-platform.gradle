// AC has one consumer artifact per loader; AtomLib owns native distribution.
if (providers.gradleProperty('atomchat.nativePlatform').isPresent()) {
    throw new GradleException('atomchat.nativePlatform is retired; build the paired AtomLib and AC target')
}
ext.atomchatNativeSuffix = ''
layout.buildDirectory.set(file('build/atomlib-consumer'))
def hostOs = System.getProperty('os.name').toLowerCase(Locale.ROOT)
def hostArch = System.getProperty('os.arch').toLowerCase(Locale.ROOT)
def os = hostOs.startsWith('windows') ? 'windows' : hostOs.contains('mac') ? 'macos' : 'linux'
def arch = hostArch in ['amd64', 'x86_64'] ? 'x64' : hostArch in ['aarch64', 'arm64'] ? 'arm64' : null
if (arch == null) throw new GradleException("Unsupported test JVM architecture: ${hostArch}")
ext.atomchatTestNativeArtifact = "skija-${os}-${arch}".toString()
ext.atomchatTestLwjglClassifier = "natives-${os}${arch == 'arm64' ? '-arm64' : ''}".toString()
