// Each Gradle invocation builds one OS variant. Keep Windows paths unchanged.
// A separate Linux build directory isolates task outputs and incremental state.
def platform = providers.gradleProperty('atomchat.nativePlatform').getOrElse('windows-x64')
if (!(platform in ['windows-x64', 'linux-x64'])) {
    throw new GradleException("atomchat.nativePlatform must be windows-x64 or linux-x64, got ${platform}")
}
ext.atomchatNativePlatform = platform
ext.atomchatNativeArtifact = "skija-${platform}".toString()
ext.atomchatNativeSuffix = platform == 'linux-x64' ? '-linux-x64' : ''
if (platform == 'linux-x64') {
    layout.buildDirectory.set(file('build/linux-x64'))
}
