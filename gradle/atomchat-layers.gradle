// ============================================================
//  AtomChat 共享层装配（由各平台 build.gradle 在 plugins 块之后 apply）
// ============================================================
//
// 它做两件事：
//   1. 把【仓库级身份】（mod_version / mod_id / …）读进来挂到 project.ext
//      —— 各平台自己不许定义这些键
//   2. 把 shared/ 与本目标挂载的层接进 main / test 源集
//
// 判定依据全部来自 versions/targets.json 与 versions/layers.json，
// 本脚本不含任何目标名硬编码：新增目标或新增层只改 JSON。

import groovy.json.JsonSlurper

def repoRoot = file('../..').canonicalFile

// ---- 1. 仓库级身份 ----
def propsFile = new File(repoRoot, 'gradle.properties')
if (!propsFile.isFile()) {
    throw new GradleException(
        "找不到 ${propsFile.path}。\n" +
        "仓库级身份（mod_version / mod_id / mod_name / mod_license / mod_group_id / mod_authors / mod_description）\n" +
        "只在仓库根那一份里，各平台不许自己定义。是不是把 platforms/<目标>/ 从仓库里单独拷出来构建了？\n" +
        "那样出来的 jar 版本号没有来源。")
}
def repoProps = new Properties()
propsFile.withInputStream { repoProps.load(it) }

['mod_id', 'mod_name', 'mod_license', 'mod_group_id', 'mod_authors', 'mod_description', 'mod_version'].each { k ->
    if (!repoProps.containsKey(k)) {
        throw new GradleException("仓库根的 gradle.properties 缺 ${k} —— 各平台不提供默认值，读不到就失败")
    }
    ext[k] = repoProps.getProperty(k)
}
ext.maven_group = repoProps.getProperty('mod_group_id')   // Fabric 侧一直叫 maven_group
['curseforge_project_id', 'modrinth_project_id'].each { k ->
    if (repoProps.containsKey(k)) {
        ext[k] = repoProps.getProperty(k)
    }
}
ext.atomchatRepoRoot = repoRoot
// 构建戳（3c）与末尾的打印都用它，所以在配置期取一次。
def repoVersion = repoProps.getProperty('mod_version')

// ---- 2. 本目标是哪一个 ----
def targetsFile = new File(repoRoot, 'versions/targets.json')
def layersFile = new File(repoRoot, 'versions/layers.json')
if (!targetsFile.isFile()) {
    throw new GradleException("找不到 ${targetsFile.path}")
}
if (!layersFile.isFile()) {
    throw new GradleException("找不到 ${layersFile.path}")
}

def relPath = repoRoot.toPath().relativize(projectDir.canonicalFile.toPath()).toString().replace('\\', '/')
def targets = new JsonSlurper().parse(targetsFile)
def targetEntry = targets.find { k, v -> !k.toString().startsWith('_') && v instanceof Map && v.project == relPath }
if (targetEntry == null) {
    throw new GradleException(
        "versions/targets.json 里没有工程路径为 ${relPath} 的目标。\n" +
        "工程目录存在就必须在矩阵里有条目 —— 否则它是一份没有任何地方验证的源码：\n" +
        "本地不编（它不是当前目标），CI 也跳过。")
}
def targetName = targetEntry.key.toString()
def targetDef = targetEntry.value as Map

def layers = new JsonSlurper().parse(layersFile)
def mounted = (targetDef.layers ?: []) as List
if (mounted.isEmpty() && !(targetDef.containsKey('no_layers') && targetDef.no_layers)) {
    logger.info("目标 ${targetName} 一层共享层都不挂（例如 1.20.1 在 1.21+ 之前）")
}
mounted.each { name ->
    if (!layers.containsKey(name)) {
        throw new GradleException("targets.json 的 ${targetName} 引用了 layers.json 里没有的层：${name}")
    }
}

// 三个轴；目录由【声明的轴】推出来：单轴 → layers/<轴名>/，多轴 → layers/<轴名按字母序 + 连接>/
def AXIS_DIR = [since: 'version', loader: 'loader', mappings: 'mapping']
def axesOf = { Map d -> ['since', 'loader', 'mappings'].findAll { d.containsKey(it) } }
def layerDir = { String name ->
    def d = layers[name] as Map
    def axes = axesOf(d)
    if (axes.isEmpty()) {
        throw new GradleException("层 ${name} 一个轴都没钉（since / loader / mappings）—— 一个都不写就是 shared/，不是层")
    }
    return new File(repoRoot, "layers/${axes.collect { AXIS_DIR[it] }.sort().join('+')}/${name}")
}

// 版本比较：够不够得到 since
def versionAtLeast = { String have, String want ->
    def a = have.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
    def b = want.tokenize('.').collect { it.isInteger() ? it.toInteger() : 0 }
    for (int i = 0; i < Math.max(a.size(), b.size()); i++) {
        int x = i < a.size() ? a[i] : 0
        int y = i < b.size() ? b[i] : 0
        if (x != y) { return x > y }
    }
    return true
}

// 挂载即声明：目标必须真的满足该层的谓词 —— yarn 家族的目标挂 official 映射层是硬错误，
// 而且要在【配置期】就红，不要等到某个文件恰好被编到才暴露。
mounted.each { name ->
    def d = layers[name] as Map
    axesOf(d).each { axis ->
        def want = d[axis].toString()
        if (axis == 'since') {
            if (!versionAtLeast(targetDef.minecraft.toString(), want)) {
                throw new GradleException(
                    "目标 ${targetName}（Minecraft ${targetDef.minecraft}）挂了版本层 ${name}（since ${want}）—— 它够不到。")
            }
        } else {
            def have = (axis == 'mappings' ? targetDef.mappings : targetDef.loader).toString()
            if (have != want) {
                throw new GradleException(
                    "目标 ${targetName} 的 ${axis} 是 ${have}，却挂了要求 ${axis}=${want} 的层 ${name}。\n" +
                    "挂载即声明：要么去掉这一层，要么这一层本来就不该给这个目标。")
            }
        }
    }
}

def mainJava = []
def mainRes = []
def testJava = []
def testRes = []

def collect = { File base, List java, List res ->
    def j = new File(base, 'src/main/java')
    def r = new File(base, 'src/main/resources')
    if (j.isDirectory()) { java << j.path }
    if (r.isDirectory()) { res << r.path }
}
collect(new File(repoRoot, 'shared'), mainJava, mainRes)
def sharedTestJava = new File(repoRoot, 'shared/src/test/java')
def sharedTestRes = new File(repoRoot, 'shared/src/test/resources')
if (sharedTestJava.isDirectory()) { testJava << sharedTestJava.path }
if (sharedTestRes.isDirectory()) { testRes << sharedTestRes.path }

mounted.each { name ->
    def d = layerDir(name as String)
    collect(d, mainJava, mainRes)
    def tj = new File(d, 'src/test/java')
    def tr = new File(d, 'src/test/resources')
    if (tj.isDirectory()) { testJava << tj.path }
    if (tr.isDirectory()) { testRes << tr.path }
}

// ---- 3. 接进源集 ----
if (project.extensions.findByName('sourceSets') == null) {
    throw new GradleException("目标 ${targetName} 的构建脚本没有 java 插件 —— 共享层源集无处可接")
}
sourceSets.main.java.srcDirs += mainJava
sourceSets.main.resources.srcDirs += mainRes
sourceSets.test.java.srcDirs += testJava
sourceSets.test.resources.srcDirs += testRes

// ---- 3b. 内嵌的 FlatLaf（重定位产物，随仓库分发） ----
//
// 【为什么不用公共 Maven 坐标】FlatLaf 住在全局包名 com.formdev.flatlaf 下。别的 mod
// 也内嵌同一份时，谁先被类加载器解析到谁赢 —— 实测发生过（一个叫 Mcpatch 的 mod
// 赢了，我们的图片选择器跑在它的副本上，Forge 的类转换器随即在一个它没有的类上报错）。
// 重定位到私有包名之后这种竞争就不存在了。
//
// 【为什么随仓库分发、不在构建期重定位】构建期重定位要把 ASM 挂上构建脚本类路径、
// 再和 include/jarJar 的取件时机对齐，三端各一套；入库一份产物则离线、确定、不碰
// 构建管线。代价是仓库多一个约 1 MB 的二进制（与既有 bundled.otf 3.89 MB 同量级）。
//
// 【为什么是本地 Maven 目录而不是裸 jar 文件】裸文件依赖两边都不收：Fabric 的
// `include` 会拒绝"not a module component and has no capabilities"的产物，Forge 的
// JarJar 要求产物有明确模块名（由 Relocate 写进 manifest 的 Automatic-Module-Name）。
// 目录仓库给出真正的坐标，两端都当普通模块处理。
//
// 重新生成：tools/relocate-flatlaf.sh <path-to-flatlaf.jar> [version]
def bundledGroup = 'com.atom.chat.bundled'
def bundledArtifact = 'flatlaf-atomchat'
def bundledVersion = project.flatlaf_version
def bundledRepoDir = new File(repoRoot, 'third_party/maven')
def bundledJar = new File(bundledRepoDir,
        "${bundledGroup.replace('.', '/')}/$bundledArtifact/$bundledVersion/$bundledArtifact-${bundledVersion}.jar")
if (!bundledJar.isFile()) {
    throw new GradleException(
        "找不到内嵌的 FlatLaf 重定位产物：${bundledJar.path}\n" +
        "各平台 gradle.properties 里 flatlaf_version=${bundledVersion}，third_party/maven 下没有对应产物。\n" +
        "重新生成：tools/relocate-flatlaf.sh <path-to-flatlaf.jar> ${bundledVersion}")
}
repositories {
    maven {
        name = 'atomchatBundled'
        url = uri(bundledRepoDir)
    }
}
ext.atomchatBundledFlatLaf = "${bundledGroup}:${bundledArtifact}:${bundledVersion}"

// Forge's JarJar rejects a plain version ("The given version specification is
// invalid: 3.7.2 ... convert this to a maven compatible format") — what it
// records in jarjar metadata is a RANGE. Derive "3.7.2" -> "[3.7.2,3.8)" so the
// upper bound follows the version instead of being hardcoded somewhere.
def vParts = bundledVersion.tokenize('.')
def vUpper = vParts.size() >= 2
        ? "${vParts[0]}.${(vParts[1] as int) + 1}"
        : "${bundledVersion}-"
ext.atomchatBundledFlatLafRange = "${bundledGroup}:${bundledArtifact}:[${bundledVersion},${vUpper})"

// ---- 3c. 构建戳（运行期环境摘要要能唯一定位构建） ----
//
// 【为什么要有它】玩家报 bug 时给的是日志，日志里只有 "v0.2.11" —— 而那个版本号
// 可能来自任何一次构建。实测发生过「jar 文件名是 0.2.8、里面的版本号是 0.2.7」这样
// 对不上的情况，光看日志无从判断交上来的到底是哪一个产物。这里把【构建那一刻】的
// 仓库事实写进 jar，运行期再配上加载器报的版本号与产物 sha256，三者互相印证。
//
// 【为什么不放一份带占位符的模板资源】那等于维护两份真相（模板 + 展开值），而且
// IDE 直接跑测试时会读到没展开的那份，日志里就会出现字面的 "${version}"。
// 生成任务的产物只进 build/，仓库里一个字节都不用留。
//
// 【为什么 git 在 doLast 里读，而不是配置期算好当一个输入】NeoForge 目标开着配置
// 缓存，配置期跑外部进程会被直接判为不支持（configuration cache entry discarded）——
// 第一版就是那么写的，NeoForge 当场红。而 git 事实又没法让 Gradle 跟踪（它读的是工作区），
// 所以这个任务用 upToDateWhen { false } 永不跳过：两次 git 调用加一个小文件，
// 代价远低于"构建戳落后于提交号"。
def loaderVersionValue = targetDef.loader_version == null ? 'unknown' : targetDef.loader_version.toString()
def buildStampDir = layout.buildDirectory.dir('generated/atomchatBuildStamp')
def generateBuildStamp = tasks.register('generateAtomchatBuildStamp') {
    group = 'atomchat'
    description = '写出构建戳资源（版本 / 目标 / 提交号），供运行期环境摘要唯一定位构建'
    outputs.dir(buildStampDir)
    outputs.upToDateWhen { false }
    inputs.property('mod_version', repoVersion)
    inputs.property('target', targetName)
    inputs.property('minecraft', targetDef.minecraft.toString())
    inputs.property('loader', targetDef.loader.toString())
    inputs.property('loader_version', loaderVersionValue)
    def outDir = buildStampDir
    def repoPath = repoRoot.path
    def mcValue = targetDef.minecraft.toString()
    def loaderValue = targetDef.loader.toString()
    doLast {
        def git = { List<String> command ->
            try {
                def stdout = new ByteArrayOutputStream()
                def process = new ProcessBuilder(command).redirectErrorStream(true).start()
                process.inputStream.transferTo(stdout)
                if (!process.waitFor(20, java.util.concurrent.TimeUnit.SECONDS) || process.exitValue() != 0) {
                    return 'unknown'
                }
                return stdout.toString('UTF-8').trim()
            } catch (Throwable ignored) {
                return 'unknown'
            }
        }
        def commit = git(['git', '-C', repoPath, 'rev-parse', '--short=7', 'HEAD'])
        def status = git(['git', '-C', repoPath, 'status', '--porcelain', '--untracked-files=no'])
        def dirty = status != 'unknown' && !status.isEmpty()
        def stamp = outDir.get().file('atomchat-build.properties').asFile
        stamp.parentFile.mkdirs()
        stamp.setText([
                '# Generated at build time by gradle/atomchat-layers.gradle (section 3c).',
                '# Do not edit, do not commit. ASCII only: Properties.load() reads the',
                '# stream as ISO-8859-1, so a non-ASCII value would arrive mangled.',
                "version=${repoVersion}",
                "target=${targetName}",
                "minecraft=${mcValue}",
                "loader=${loaderValue}",
                "loader_version=${loaderVersionValue}",
                "git_commit=${commit}",
                "git_dirty=${dirty}",
                ''
        ].join('\n'), 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(generateBuildStamp)

// ---- 4. 打印（算出来的，不手写） ----
// 这些值在【配置期】取好：doLast 里碰 project / sourceSets 会让配置缓存失效
// （NeoForge 目标开着 org.gradle.configuration-cache=true）。
def targetLabel = "${targetDef.minecraft} / ${targetDef.loader} ${targetDef.loader_version}".toString()
def mountedList = mounted.collect { it.toString() }
def mainJavaList = mainJava.collect { it.toString() }
def mainResList = mainRes.collect { it.toString() }
def testJavaList = testJava.collect { it.toString() }
def testResList = testRes.collect { it.toString() }

tasks.register('atomchatLayers') {
    group = 'atomchat'
    description = '打印本目标挂载的共享层与接进来的源目录'
    doLast {
        logger.lifecycle("目标 ${targetName}：${targetLabel}，仓库版本 ${repoVersion}")
        logger.lifecycle("  挂载层：${mountedList.isEmpty() ? '（无）' : mountedList.join(', ')}")
        logger.lifecycle("  main java：${mainJavaList.isEmpty() ? '（共享层暂无内容）' : mainJavaList.join(', ')}")
        logger.lifecycle("  main resources：${mainResList.isEmpty() ? '（共享层暂无内容）' : mainResList.join(', ')}")
        logger.lifecycle("  test java：${testJavaList.isEmpty() ? '（共享层暂无内容）' : testJavaList.join(', ')}")
        logger.lifecycle("  test resources：${testResList.isEmpty() ? '（共享层暂无内容）' : testResList.join(', ')}")
    }
}

// ---- 5. 裸值棘轮守卫（bareValueCheck / bareBaselineUpdate） ----
//
// 【它拦什么】`s(数字)` 裸值：绕过 token 体系的硬编码缩放值。2026-10-05 三个按钮家族三套数、
// 11 条家族 mismatch 而测试全绿，根因就是裸值没人拦。拆分期更危险 —— 代码从 AtomChatScreen
// 搬进 layers/shared 时字面量跟着搬进来，没有守卫就没人看得见「这一块又多了 12 处」。
//
// 【为什么挂在 check 上】CI 每平台跑 `./gradlew build`（build 依赖 check），挂 check 即自动
// 进 CI，workflow 文件零改动。口径（正则词边界 / 去重视图 / 注释与豁免）只有一份实现：
// tools/bare_scan.py；Gradle 只负责在正确的位置调它，不在构建脚本里重写一套判据。
//
// 【解释器为什么在执行期挑】本机（Windows）PATH 上的 `python3` 是个不认识 --version 的包装器
// （实测 exit 9009），而 CI（ubuntu）只有 python3 可靠。配置期探测外部进程会让 NeoForge 的
// 配置缓存失效（见 3c 的踩坑记录），所以在 doLast 里按候选顺序探测。
def pythonCandidates = [['python3'], ['python'], ['py', '-3']]

// 探测一个能用的解释器：必须 `--version` 返回 0 且输出里有 "Python"。
// 只看退出码不够 —— 本机那个坏的 python3 也会「启动成功」然后返回 9009。
def resolvePython = {
    for (def cand : pythonCandidates) {
        try {
            def p = new ProcessBuilder((cand + ['--version']) as List<String>)
                    .redirectErrorStream(true).start()
            def out = p.inputStream.getText('UTF-8')
            if (p.waitFor() == 0 && out.contains('Python')) {
                return cand as List<String>
            }
        } catch (Throwable ignored) {
            // 换下一个候选
        }
    }
    throw new GradleException(
            "找不到可用的 python 解释器（试过 ${pythonCandidates.collect { it.join(' ') }.join(' / ')}）。\n" +
            "裸值守卫与 tools/ 下的校验脚本都是 python3 写的；CI（ubuntu）自带 python3，\n" +
            "本机请装一个 python3 或在 PATH 上放一个能用的 python。")
}

// 跑一个 python 工具：输出直接进控制台，非零退出即构建失败（报文由工具自己给）。
def runPythonTool = { List<String> args ->
    def python = resolvePython()
    def pb = new ProcessBuilder((python + args) as List<String>)
    pb.directory(repoRoot)
    pb.redirectErrorStream(true)
    def p = pb.start()
    p.inputStream.transferTo(System.out)
    def code = p.waitFor()
    if (code != 0) {
        throw new GradleException("${args.join(' ')} 失败（exit ${code}）")
    }
}

tasks.register('bareValueCheck') {
    group = 'atomchat'
    description = '裸值棘轮守卫：扫 s(数字) 字面量，新增即红（口径与基线见 tools/bare_scan.py / tools/bare_baseline.json）'
    doLast {
        runPythonTool(['tools/bare_scan.py'])
    }
}
tasks.named('check') { dependsOn 'bareValueCheck' }

tasks.register('bareBaselineUpdate') {
    group = 'atomchat'
    description = '重写裸值基线（拆块迁移后允许；commit message 必须写明 +N 处系迁移自 AtomChatScreen）'
    doLast {
        runPythonTool(['tools/bare_scan.py', '--update'])
        logger.lifecycle("基线已更新 —— 记得在 commit message 里写明迁入的 +N 处来源")
    }
}

// ---- 6. 孪生残差报告（twinDiffReport） ----
//
// 它与 verify_targets.py 的孪生检查分工：那个验「副本在不在 + 有没有逐字相同」，
// 这个验「内容差异能不能全部归类为映射改名」。fabric 孪生多一行逻辑，只有这里会红。
// 不进 check：它是**审查工具**（会打印残差细节、需要人读），check 里挂它只会让
// 「已经声明的既有分歧」反复占用构建输出；阶段 2 的每块验证电池里手动跑它。
tasks.register('twinDiffReport') {
    group = 'atomchat'
    description = '孪生残差报告：official ↔ fabric 内容比对，未归类残差非空即失败'
    doLast {
        runPythonTool(['tools/twin_diff_report.py'])
    }
}

// ---- 7. 基准帧入口（goldenCapture / goldenCompare） ----
//
// 【为什么不是 CI 门】Skia 的 CPU 光栅不保证跨机器 / 跨 Skija 版本逐字节一致，所以
// golden/ 只在本机当「拆分前后」的对照，且已 gitignore。阶段 2 每拆一块：
// 拆前 goldenCapture（若尚无基准）→ 拆后 goldenCompare（differing pixels 必须 0）。
//
// 【模式怎么传】测试侧读系统属性 atomchat.golden.mode（capture / compare / off）。
// 两个入口任务必须把模式在【配置期】写进 test 任务的系统属性，所以只能靠
// startParameter 判断这次跑的是哪个入口（配置缓存在意的是配置期跑外部进程，
// 读 startParameter 是配置输入的一部分）。也支持 -Patomchat.golden.mode=… 直传。
def goldenModes = [goldenCapture: 'capture', goldenCompare: 'compare', goldenDeterminism: 'determinism']
def requestedGolden = gradle.startParameter.taskNames
        .collect { it.tokenize(':').last() }
        .findResult(null) { goldenModes.containsKey(it) ? goldenModes[it] : null }
def goldenMode = (project.findProperty('atomchat.golden.mode') ?: requestedGolden ?: 'off').toString()
if (!['off', 'capture', 'compare', 'determinism'].contains(goldenMode)) {
    throw new GradleException("atomchat.golden.mode 只能是 off / capture / compare / determinism，收到 ${goldenMode}")
}
tasks.named('test', Test).configure {
    systemProperty 'atomchat.golden.mode', goldenMode
    // 目标名与仓库根由构建脚本给出：测试的工作目录**不一定是工程目录**
    // （NeoForge 的 ModDevGradle 把测试跑在 build/minecraft-junit 下），
    // 让测试从 cwd 猜目标名会在 neo 上把基准帧写进 golden/minecraft-junit/。
    systemProperty 'atomchat.golden.target', targetName
    systemProperty 'atomchat.repoRoot', repoRoot.path
    systemProperty 'atomchat.projectDir', projectDir.path
    if (goldenMode != 'off') {
        // 入口任务只为基准帧而来：整套测试跑一遍太慢，这里只跑 GoldenFrameTest
        filter { includeTestsMatching 'com.atom.chat.render.GoldenFrameTest' }
    }
}
def goldenDescriptions = [
        capture    : '拍基准帧到仓库根 golden/<目标>/（本机对照用，CI 不跑）',
        compare    : '对拍基准帧：重渲 + 逐字节比，differing pixels 必须为 0',
        determinism: '确定性实证：同一 JVM 连拍两次，逐页断言 PNG 逐字节相同',
]
goldenModes.each { taskName, mode ->
    tasks.register(taskName) {
        group = 'atomchat'
        description = goldenDescriptions[mode]
        dependsOn tasks.named('test')
    }
}
