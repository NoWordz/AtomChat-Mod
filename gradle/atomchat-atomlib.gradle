import groovy.json.JsonSlurper
import java.security.MessageDigest

def lock = new JsonSlurper().parse(new File(atomchatRepoRoot, 'versions/atomlib.json'))
def target = projectDir.name
def definition = lock.targets[target]
if (definition == null) throw new GradleException("No AtomLib input for ${target}")
ext.atomlibVersion = lock.version.toString()
// 【空串不是通配符，三端一律用锁里的 compatibility_range】
// 这里曾按目标分成两套写法（Forge 空串、NeoForge '*'），凭的是一句「Forge 用空串
// 表示任意版本」。它是错的：两端都把这段字符串交给 Maven 的
// VersionRange.createFromVersionSpec()，而空串解析出来的范围里没有任何 Restriction，
// VersionRange.containsVersion() 只遍历 Restriction —— 于是恒返回 false。
// 后果不是「范围放宽」，而是「一个版本都不匹配」：装了任何版本的 AtomLib，
// Forge 的 ModSorter 都报 Missing or unsupported mandatory dependencies 里的
// Expected range: ''，atomchat 整个加载不起来。改成 '*' 之后才真的匹配全部版本。
// 所以别再按加载器分叉：版本范围的语义由 Maven 定，三端同一份字符串。
def compatibilityRange = lock.compatibility_range?.toString()?.trim()
if (!compatibilityRange) {
    throw new GradleException(
        "versions/atomlib.json 的 compatibility_range 为空。\n" +
        "空串会被 Maven 的 VersionRange 解析成「没有任何版本可满足」，" +
        "打出来的 jar 会拒绝掉任意版本的 AtomLib。写 \"*\" 表示任意版本。")
}
ext.atomlibVersionRange = compatibilityRange
def coordinate = "${lock.group}:${definition.artifact}:${lock.version}".toString()
def repositoryPath = providers.gradleProperty('atomlibMavenRepo').orElse(providers.environmentVariable('ATOMLIB_MAVEN_REPO'))
if (!repositoryPath.isPresent()) {
    throw new GradleException('AtomLib Maven input required: pass -PatomlibMavenRepo=<absolute test-maven directory>; CI uses the pinned input archive')
}
def repositoryDir = file(repositoryPath.get())
if (!repositoryDir.isDirectory()) throw new GradleException("AtomLib Maven input does not exist: ${repositoryDir}")
repositories {
    exclusiveContent {
        forRepository { maven { name='AtomLibInput'; url=repositoryDir.toURI() } }
        // ForgeGradle serves a synthetic _mapped_ coordinate from its own
        // repository; reserve only the original locked input for this repo.
        filter { includeVersion(lock.group.toString(), definition.artifact.toString(), lock.version.toString()) }
    }
    exclusiveContent {
        forRepository { maven { name='AtomLibUpstream'; url='https://repo.maven.apache.org/maven2/' } }
        filter { includeGroup 'org.lwjgl'; includeGroup 'io.github.humbleui' }
    }
}
dependencies {
    if (target.endsWith('-fabric')) modImplementation coordinate
    else implementation coordinate
    testRuntimeOnly "org.lwjgl:lwjgl:${definition.yoga}:${atomchatTestLwjglClassifier}"
    testRuntimeOnly "org.lwjgl:lwjgl-yoga:${definition.yoga}:${atomchatTestLwjglClassifier}"
}
def metadata = tasks.register('generateAtomLibRequirement') {
    def output = layout.buildDirectory.file('generated/atomlib-requirement/atomchat-atomlib.properties')
    inputs.property('version', atomlibVersion)
    outputs.file(output)
    doLast {
        def file = output.get().asFile
        file.parentFile.mkdirs()
        file.setText("version=${lock.version}\n", 'UTF-8')
    }
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/atomlib-requirement'))
tasks.named('processResources') { dependsOn metadata }
tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn metadata }
def original = configurations.detachedConfiguration(dependencies.create(coordinate))
original.transitive = false
def expected = lock.sha256[target]
tasks.register('verifyAtomLibInput') {
    inputs.files(original)
    inputs.property('expectedSha256', expected ?: 'UNPINNED')
    doLast {
        if (!expected) throw new GradleException("Unpinned AtomLib input: ${target}; export the paired input before final build")
        def digest = MessageDigest.getInstance('SHA-256').digest(original.singleFile.bytes).encodeHex().toString()
        if (digest != expected) throw new GradleException("AtomLib input SHA-256 mismatch: ${target}; expected ${expected}, got ${digest}")
    }
}
tasks.named('check') { dependsOn 'verifyAtomLibInput' }
