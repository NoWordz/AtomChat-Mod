plugins {
    id 'java'
}

version = '0.1.0'

def platforms = [
    fabric:   [loader: 'Fabric',   minecraft: '1.21.1', java: 21],
    neoforge: [loader: 'NeoForge', minecraft: '1.21.1', java: 21],
    forge:    [loader: 'Forge',    minecraft: '1.20.1', java: 17]
]
def targetName = providers.gradleProperty('platform').getOrElse('fabric')
def target = platforms[targetName]
if (target == null) {
    throw new GradleException("Unknown -Pplatform=${targetName}. Use fabric, neoforge, or forge.")
}

// Only the API is referenced. Use either the built host JAR or the host's compiled
// classes directory while developing the API. Neither input is included in the output.
def atomchat = providers.gradleProperty('atomchatApi').map { file(it) }
def apiInput = atomchat.orNull
def apiClass = 'com/atom/chat/api/ui/AppearanceUi.class'
if (apiInput == null || !(apiInput.isFile() || new File(apiInput, apiClass).isFile())) {
    throw new GradleException('Pass -PatomchatApi=<path to an AtomChat JAR with AppearanceUi or its classes directory>.')
}

layout.buildDirectory = layout.projectDirectory.dir("build/${targetName}")

repositories {
    mavenCentral()
    maven { url = 'https://maven.fabricmc.net/' }
    maven { url = 'https://maven.neoforged.net/releases' }
    maven { url = 'https://maven.minecraftforge.net/' }
}

configurations {
    appearanceCompileOnly
}
dependencies {
    appearanceCompileOnly files(apiInput)
    appearanceCompileOnly 'io.github.humbleui:skija-shared:0.143.18'
    // The examples reference only FML or Fabric Loader classes and Skija. No
    // Minecraft symbols are compiled, so no mappings or remapping are needed.
    switch (targetName) {
        case 'fabric':
            appearanceCompileOnly 'net.fabricmc:fabric-loader:0.16.9'
            break
        case 'neoforge':
            appearanceCompileOnly('net.neoforged.fancymodloader:loader:4.0.44') { transitive = false }
            appearanceCompileOnly('net.neoforged:mergetool:2.0.3:api') { transitive = false }
            break
        case 'forge':
            appearanceCompileOnly 'net.minecraftforge:javafmllanguage:1.20.1-47.4.10@jar'
            appearanceCompileOnly 'net.minecraftforge:fmlloader:1.20.1-47.4.10@jar'
            appearanceCompileOnly('net.minecraftforge:mergetool:1.1.7:api') { transitive = false }
            break
    }
}

def addons = [
    harbor: [
        id: 'atomchat_harbor',
        name: 'AtomChat Harbor / 港湾',
        description: 'Chamfered bubbles and panel, a teal avatar frame, and an animated harbor. / 提供切角气泡和面板、青色头像框与动态港湾壁纸。'
    ],
    signal: [
        id: 'atomchat_signal',
        name: 'AtomChat Signal / 信号',
        description: 'Rounded bubbles and amber avatar brackets. / 提供圆润气泡和琥珀色头像角标。'
    ]
]

addons.each { addonName, addon ->
    def sources = sourceSets.create(addonName) {
        java.setSrcDirs(["${addonName}/java", "${targetName}/${addonName}"])
        resources.setSrcDirs(["${addonName}/resources", "${targetName}/resources"])
    }
    configurations.named(sources.compileOnlyConfigurationName) {
        extendsFrom configurations.appearanceCompileOnly
    }
    tasks.named(sources.processResourcesTaskName) {
        filteringCharset = 'UTF-8'
        def metadata = [id: addon.id, name: addon.name, description: addon.description,
                        version: project.version, entrypoint: "com.niuqu.${addon.id}.FabricEntry"]
        inputs.properties(metadata)
        filesMatching(['fabric.mod.json', 'META-INF/*.toml']) {
            expand(metadata)
        }
    }

    def addonJar = tasks.register("${addonName}Jar", Jar) {
        archiveBaseName = "${addon.id}-${target.loader}-${target.minecraft}"
        archiveVersion = "v${project.version}"
        from sources.output
        from '../../LICENSE'
        preserveFileTimestamps = false
        reproducibleFileOrder = true
    }
    tasks.named('assemble') { dependsOn addonJar }
}

tasks.named('jar') { enabled = false }
tasks.withType(JavaCompile).configureEach {
    options.release = target.java
    options.encoding = 'UTF-8'
}
